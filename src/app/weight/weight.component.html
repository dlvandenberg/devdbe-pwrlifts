<div class="row">
  <div class="col-xs-12 col-md-8 offset-md-2 pb-2">
    <app-weight-chart></app-weight-chart>
  </div>
</div>
<div class="row">
  <div class="col-xs-12 col-md-8 offset-md-2 text-right pb-2">
    <button class="btn btn-primary" i18n (click)="weightService.startEditing()">New weight</button>
  </div>
</div>
<div class="row">
    <div class="col-xs-12 col-md-8 offset-md-2">
      <app-edit-weight *ngIf="weightService.editing$ | async" [weight]="weightService.editingWeight$ | async"></app-edit-weight>
        <table class="table table-hover table-responsive-md">
            <thead class="thead-dark">
              <tr class="table-secondary">
                <th scope="col" i18n>Weight (kg)</th>
                <th scope="col" class="hideOnSmall" i18n>Calories (kcal)</th>
                <th scope="col" i18n>Date</th>
                <th scope="col" class="hideOnSmall" i18n>Time</th>
                <th scope="col" class="w-10" i18n>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr class="text-white bg-dark-gray" *ngFor="let weight of (weightService.weights$ | async)">
                <td>{{ weight.weight }}</td>
                <td class="hideOnSmall" >{{ weight.calories }}</td>
                <td>{{ weight.date | date:'dd-MM-yyyy' }}</td>
                <td class="hideOnSmall">{{ weight.time }}</td>
                <td class="actions w-10">
                    <span class="oi oi-pencil pointer" (click)="weightService.startEditingExisting(weight)"></span>
                    <span class="oi oi-trash pointer danger" (click)="weightService.delete(weight.id)"></span>
                </td>
              </tr>
            </tbody>
          </table>
    </div>
</div>
