<div class="row">
    <div class="col-xs-12 col-md-8 offset-md-2 text-right pb-2">
        <button class="btn btn-primary" i18n (click)="oneRepMaxService.startEditing()">New {{ exercise }} record</button>
    </div>
</div>
<div class="row">
    <div class="col-xs-12 col-md-8 offset-md-2">
        <app-edit-one-rep-max *ngIf="oneRepMaxService.editing$ | async" 
            [oneRepMax]="oneRepMaxService.editingOneRepMax$ | async"
            [exercise]="exercise"
        >
        </app-edit-one-rep-max>
        <table class="table table-hover table-responsive-md">
            <thead class="thead-dark">
                <tr class="table-secondary">
                    <th scope="col" i18n>1RM</th>
                    <th scope="col" class="hideOnSmall" i18n>Weight (kg)</th>
                    <th scope="col" class="hideOnSmall" i18n>Reps</th>
                    <th scope="col" class="hideOnSmall" i18n>Calculated</th>
                    <th scope="col" i18n>Date</th>
                    <th scope="col" class="hideOnSmall" i18n>Time</th>
                    <th scope="col" class="hideOnSmall" i18n>RPE (0-10)</th>
                    <th scope="col" class="w-10" i18n>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr class="text-white bg-dark-gray" *ngFor="let oneRepMax of (oneRepMaxService.oneRepMaxes$(exercise) | async)">
                    <td>{{ oneRepMax.oneRepMax }}</td>
                    <td class="hideOnSmall">{{ oneRepMax.weight }}</td>
                    <td class="hideOnSmall">{{ oneRepMax.reps }}</td>
                    <td class="hideOnSmall">{{ oneRepMax.calculated ? 'Yes' : 'No' }}</td>
                    <td>{{ oneRepMax.date | date:'dd-MM-yyyy' }}</td>
                    <td class="hideOnSmall">{{ oneRepMax.time }}</td>
                    <td class="hideOnSmall">{{ oneRepMax.rpe }}</td>
                    <td class="actions w-10">
                        <span class="oi oi-pencil pointer" (click)="oneRepMaxService.startEditingExisting(oneRepMax)"></span>
                        <span class="oi oi-trash pointer danger"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
