<div class="card text-white bg-dark-gray mb-3 text-center dashboard">
    <div class="card-body">
        <h4 class="card-title" i18n>WILKS SCORE</h4>
        <h1 class="card-text card-number" *ngIf="!(dashboardService.calculatingWilks$ | async)">
            {{ (dashboardService.wilks$ | async) | number:'1.0-2' }}</h1>
        <app-loading-spinner *ngIf="dashboardService.calculatingWilks$ | async"></app-loading-spinner>
    </div>
</div>
