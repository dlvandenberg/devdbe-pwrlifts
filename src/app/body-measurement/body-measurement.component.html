<div class="row">
    <div class="col-xs-12 col-md-8 offset-md-2 pb-2">
        <app-body-measurement-chart></app-body-measurement-chart>
    </div>
</div>
<div class="row">
    <div class="col-xs-12 col-md-8 offset-md-2 text-right pb-2">
      <button class="btn btn-primary" i18n (click)="bodyMeasurementService.startEditing()">New {{ measurementType.name }}</button>
    </div>
</div>
<div class="row">
    <div class="col-xs-12 col-md-8 offset-md-2">
        <app-edit-body-measurement *ngIf="bodyMeasurementService.editing$ | async"
            [measurement]="bodyMeasurementService.editingMeasurement$ | async"
            [measurementType]="measurementType"
        ></app-edit-body-measurement>
        <table class="table table-hover table-responsive-md">
            <thead class="thead-dark">
                <tr class="table-secondary">
                <th scope="col" i18n>{{ measurementType.capitalizedName + ' (' + measurementType.unitSymbol + ')'}}</th>
                <th scope="col" class="hideOnSmall" i18n>Calories (kcal)</th>
                <th scope="col" i18n>Date</th>
                <th scope="col" class="hideOnSmall" i18n>Time</th>
                <th scope="col" class="w-10" i18n>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr class="text-white bg-dark-gray" *ngFor="let measurement of bodyMeasurementService.measurements$(measurementType) | async">
                <td>{{ measurement.measurement }}</td>
                <td class="hideOnSmall" >{{ measurement.calories }}</td>
                <td>{{ measurement.date | date:'dd-MM-yyyy' }}</td>
                <td class="hideOnSmall">{{ measurement.time }}</td>
                <td class="actions w-10">
                    <span class="oi oi-pencil pointer" (click)="bodyMeasurementService.startEditingExisting(measurement)"></span>
                    <span class="oi oi-trash pointer danger" (click)="bodyMeasurementService.delete(measurement.id)"></span>
                </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
