<div class="backdrop"></div>
<div class="modal fade show" tabindex="1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content bg-dark-gray">
            <div class="modal-header">
                <h5 class="modal-title" i18n>Error!</h5>
                <button type="button" class="close" (click)="dismiss.emit()" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                {{ message }}
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="dismiss.emit()" i18n>Close</button>
            </div>
        </div>
    </div>
</div>
